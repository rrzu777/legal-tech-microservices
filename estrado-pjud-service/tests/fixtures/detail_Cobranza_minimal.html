<!--
  Fixture minima de COBRANZA. Reproduce la estructura real de la tabla de
  movimientos de OJV (bajada el 29 jul 2026 de una causa de cobranza en
  produccion) con contenido anonimizado: lo que se testea es el MAPA DE
  COLUMNAS, no los datos de la causa.

  Lo que importa y por que:
  - 9 columnas, no 8. El fallback _CIVIL_COLS asumia 8 y ponia `fecha` en el
    indice 6, que en cobranza es "Estado Firma" -> el parser mandaba "Firmado"
    a una columna `date` de Postgres (22007) y a los 10 intentos la causa
    quedaba suspendida.
  - El select de cuaderno se llama selCuadernoCob, no selCuaderno: por eso el
    cuaderno salia vacio y las claves de movimiento quedaban "ROL::folio".
  - El div de movimientos es historiaCob (el que matchea _MOVEMENT_DIV_IDS).

  Los acentos van como entidades HTML a proposito: el loader de los tests decodifica
  latin-1 (que es lo que sirve OJV de verdad), asi que un archivo UTF-8 con acentos
  crudos llega como mojibake. Con entidades, el fixture no depende de la codificacion.
-->
